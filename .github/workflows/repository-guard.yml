name: Repository Guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Python syntax
        shell: bash
        run: |
          if find . -type f -name '*.py' -not -path './.git/*' | grep -q .; then
            python3 -m compileall -q .
          fi

      - name: Validate shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do bash -n "$file"; done \
            < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0)
