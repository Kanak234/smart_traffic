[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-traffic"
version = "1.0.0"
description = "Synchronized Multi-Intersection Traffic Signal Network Simulator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kanak" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "build",
]

[project.scripts]
smart-traffic = "main:main"

[tool.setuptools]
py-modules = ["config", "main", "stats"]
packages = ["core", "render"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=core --cov=stats --cov=config --cov=main --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
